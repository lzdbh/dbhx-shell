[workspace]
resolver = "2"
members = [
  "crates/dbhx-model",
  "crates/dbhx-vault",
  "crates/dbhx-ssh",
  "crates/dbhx-telnet",
  "crates/dbhx-pty",
  "crates/dbhx-session",
  "crates/dbhx-sftp",
  "crates/dbhx-sync",
  "crates/dbhx-ipc",
  "crates/dbhx-testsrv",
  "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[workspace.dependencies]
# 共享外部依赖，版本只在根处钉一次
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1", features = ["derive"] }
rand = "0.9"

# 连接层。
# russh 默认后端是 aws-lc-rs，它会 links aws_lc_0_46_0 并在 build.rs 里编 C ——
# 交叉 aarch64-pc-windows-msvc / aarch64-apple-darwin 的 `cargo check` 因此必须装
# 目标平台 cmake+nasm+CC，CI 矩阵直接崩。改用纯 Rust 路径可控的 ring。
russh = { version = "0.64", default-features = false, features = [
  "flate2",
  "ring",
  "rsa",
  "des",
] }
russh-sftp = "3"
portable-pty = "0.9"

# 存储层刻意不用 rusqlite/bundled：那会在 build.rs 里跑 cc，
# 交叉 aarch64-pc-windows-msvc 的 cargo check 需要目标三元组的 C 编译器，CI 矩阵会因此崩。
# vault 改成 AES-256-GCM 加密的单文件 JSON 文档，纯 Rust、原子写、跨平台零工具链依赖。
aes-gcm = "0.10"
keyring = "4"

# 云同步信封的 KDF。纯 Rust（blake2 是它的自带依赖，不引 C），
# 选 Argon2id 而不是已经在树里的 ring/PBKDF2：云端那份密文要按「谁都能下载」设防，
# 离线爆破没有速率限制，内存硬参数是把显卡优势打掉的那一道。
argon2 = "0.5"

# 云同步的传输层。三样都是刻意选的：
# - default-features = false：reqwest 默认的 native-tls 会拉 OpenSSL，交叉编译矩阵立刻崩；
# - rustls-tls-native-roots：读**系统信任库**。装 Steam++ 或公司 SSL 审查网关的机器上，
#   证书链由那个网关签发、根证书只进了系统库；用 rustls 自带的 webpki-roots 的话，
#   这些用户同步功能一律连不上，而且报错只会是「证书错误」。
# - rustls 走 ring 后端（见上面 russh 那段），别让 aws-lc-rs 混进来——它要 cmake+nasm。
# - json：请求体是 `files → content` 的嵌套对象，手写字符串拼接等于把转义交给运气。
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls-native-roots",
  "http2",
  "json",
] }

# 云端片段接口的 `content` 是 JSON 字符串，而信封是任意字节：必须有一层文本编码。
# 用它而不是 vault 里那个手写的 base64——那一份只为内部存储服务，
# 跨网络的编解码要处理两种字母表与填充，不该由手写的查表码负责。
base64 = "0.22"

# 系统剪贴板。前端用 `navigator.clipboard` 读写会在 WebView2 上弹出原生的
# 「xx 想要查看复制到剪贴板的文本」授权气泡——桌面应用不该有这种交互，
# 所以剪贴板访问下沉到 Rust。纯 Rust 实现（windows-sys / objc2 / x11rb），
# 交叉 cargo check 不需要目标平台的 C 工具链。
arboard = { version = "3", default-features = false }

# 原生「选目录」对话框：设置页的下载目录与日志目录。
# 刻意关默认 feature：`wayland` 只为给对话框挂父窗口，我们不挂，却要把
# wayland-client/protocols 那一整套拖进 linux 构建；另一条后端 `gtk3` 要 pkg-config +
# C 工具链，交叉 cargo check 矩阵立刻崩（同上面 rusqlite/arboard 那两处理由）。
# 只留 `xdg-portal`：它在运行时 dlopen `libdbus-1.so`，编译期零 C 依赖，没装 portal 的
# 机器上 rfd 自己退到 zenity。这两个 feature 一个都不开时 rfd 的 build.rs 直接 panic，
# 所以 `xdg-portal` 不能删。
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

# IPC 类型生成：tauri-specta 对 Tauri 2 的支持仍在 rc 线，
# 且 specta 必须与 tauri-specta 的 rc 号严格对齐，勿单独升级
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-serde = "0.0.12"
specta-typescript = "0.0.12"
specta-util = "0.0.12"

# 内部 crate
dbhx-model = { path = "crates/dbhx-model" }
dbhx-vault = { path = "crates/dbhx-vault" }
dbhx-ssh = { path = "crates/dbhx-ssh" }
dbhx-telnet = { path = "crates/dbhx-telnet" }
dbhx-pty = { path = "crates/dbhx-pty" }
dbhx-session = { path = "crates/dbhx-session" }
dbhx-sftp = { path = "crates/dbhx-sftp" }
dbhx-sync = { path = "crates/dbhx-sync" }
dbhx-ipc = { path = "crates/dbhx-ipc" }
# 只给 dev-dependencies 用：SSH/SFTP 协议路径需要真服务器才能跑到
dbhx-testsrv = { path = "crates/dbhx-testsrv" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
