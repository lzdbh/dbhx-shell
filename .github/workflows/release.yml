name: release

# 打 tag（或手动指定 tag）即触发多端产物构建，并汇总到一个 GitHub Release。
# 平台矩阵与 ci.yml 的 cargo check 矩阵对齐：Windows x64/arm64、macOS universal、
# Linux x86_64/aarch64。aarch64-pc-windows-msvc 是在 x64 runner 上交叉链接的
# （Tauri 会取 VS 的 arm64 工具链 + arm64 版 WiX/NSIS 模板），产物能不能真装到
# arm64 机器上只能等装机验证，本地没有 arm 设备可跑。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建并发布的 tag（必须已推到本仓库），如 v0.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"
  PNPM_VERSION: "11.18.0"

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # 前端那步用 tee 把日志同时留一份给失败时导出；没有 pipefail 的话
    # vue-tsc 退出码会被 tee 吃掉，红叉永远打在后面的 tauri 步骤上。
    defaults:
      run:
        shell: bash -eo pipefail {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
          - label: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            rust_targets: aarch64-pc-windows-msvc
          # universal-apple-darwin 一次产出含 x86_64 + aarch64 两个切片的 .dmg/.app，
          # 比拆成两个 job 再合并 dmg 省事，且 mac 用户不需要知道自己该下哪个。
          # 但它是 Tauri 的合成 triple，rustup 里没有，所以装的是两个真 slice target。
          - label: macos-universal
            os: macos-latest
            target: universal-apple-darwin
            rust_targets: x86_64-apple-darwin,aarch64-apple-darwin
          - label: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
          # aarch64 用原生 arm64 runner：Debian/Ubuntu 没有 libwebkit2gtk-4.1-dev 的
          # arm64 交叉包，交叉打包在 x64 runner 上装不出依赖。
          - label: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            rust_targets: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system deps (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            rpm patchelf
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Install Linux system deps (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          # ubuntu-24.04-arm 的原生架构就是 arm64，直接装本包，不需要 dpkg --add-architecture
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            rpm patchelf
        env:
          DEBIAN_FRONTEND: noninteractive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # 先跑一遍前端 typecheck + build：tauri-action 的 beforeBuildCommand 也会跑，
      # 但失败时报错埋在 tauri 日志里，单独一步能直接定位是 TS 还是 Rust 挂了。
      - name: Frontend build
        env:
          BUILD_LOG_DIR: ${{ runner.temp }}/build-logs
        run: |
          mkdir -p "$BUILD_LOG_DIR"
          pnpm --filter frontend build 2>&1 | tee "$BUILD_LOG_DIR/frontend.log"

      - name: Build release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 输入名是 tagName，不是 releaseTag：写错的话五条 job 会把包全打完，
          # 再在上传 Release 那一步一起报 "Unexpected input(s)"，白烧一小时 runner。
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          projectPath: src-tauri
          args: --target ${{ matrix.target }} --verbose

      # GitHub 的 annotation 只留最后一行，真实报错（vue-tsc 诊断、pnpm 的 ERR_*）
      # 全在中段；而 run log 的下载端点要鉴权，本机没 token 下不动。
      # cargo 的输出靠上面那步的 --verbose 直接进 run log，这里补前端日志与产物目录现状。
      - name: Dump logs on failure
        if: failure()
        env:
          BUILD_LOG_DIR: ${{ runner.temp }}/build-logs
        run: |
          for f in "$BUILD_LOG_DIR"/*; do
            [ -f "$f" ] || continue
            echo "==================== $(basename "$f") ===================="
            tail -n 400 "$f"
          done
          echo "==================== bundle dir ===================="
          ls -lR src-tauri/target 2>/dev/null | tail -n 60 || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.label }}
          path: ${{ runner.temp }}/build-logs/
          if-no-files-found: ignore
          retention-days: 7
