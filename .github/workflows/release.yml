name: release

# 打 tag（或手动指定 tag）即触发多端产物构建，并由 release job 汇总到一个 GitHub Release。
# 平台矩阵与 ci.yml 的 cargo check 矩阵对齐：Windows x64/arm64、macOS universal、
# Linux x86_64/aarch64。aarch64-pc-windows-msvc 是在 x64 runner 上交叉链接的
# （Tauri 取 VS 的 arm64 工具链 + arm64 版 WiX/NSIS 模板），能不能真装到 arm64 机器上
# 只能等装机验证，本地没有 arm 设备可跑。
#
# 为什么不走 tauri-action：它会吞掉底层报错，只留一句 "Release not found or created"
# （同一份 permissions 下用 curl/gh 建 Release 是通的，见 token-probe 那一轮的结论），
# 而且失败时把自己上传的 workflow artifact 一并删掉，等于什么都拿不到。
# 所以打包用 `pnpm tauri build`，产物走 artifact，Release 由收尾 job 的 gh 组装。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建并发布的 tag（必须已推到本仓库），如 v0.1.0"
        required: true
        type: string

# contents: write —— gh 建 Release；actions: read —— release job 下载各平台的 artifact。
# 一旦显式声明 permissions，未列出的作用域就变成 none，少写一个就是在猜。
permissions:
  contents: write
  actions: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"
  PNPM_VERSION: "11.18.0"
  # 上传 artifact 用的 glob；与下面 Locate 那步的 find 条件是同一份清单，
  # 免得两处漂移成「传上来的 artifact 里 release job 找不到包」。
  BUNDLE_GLOBS: |
    src-tauri/target/**/release/bundle/**/*.msi
    src-tauri/target/**/release/bundle/**/*.exe
    src-tauri/target/**/release/bundle/**/*.dmg
    src-tauri/target/**/release/bundle/**/*.deb
    src-tauri/target/**/release/bundle/**/*.rpm
    src-tauri/target/**/release/bundle/**/*.AppImage
    src-tauri/target/**/release/bundle/**/*.appimage
    src-tauri/target/**/release/bundle/**/updater/*.sig

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # 前端那步用 tee 把日志同时留一份给失败时导出；没有 pipefail 的话
    # vue-tsc 退出码会被 tee 吃掉，红叉永远打在后面的 tauri 步骤上。
    defaults:
      run:
        shell: bash -eo pipefail {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
          - label: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            rust_targets: aarch64-pc-windows-msvc
          # universal-apple-darwin 一次产出含 x86_64 + aarch64 两个切片的 .dmg/.app，
          # 比拆成两个 job 再合并 dmg 省事，且 mac 用户不需要知道自己该下哪个。
          # 但它是 Tauri 的合成 triple，rustup 里没有，所以装的是两个真 slice target。
          - label: macos-universal
            os: macos-latest
            target: universal-apple-darwin
            rust_targets: x86_64-apple-darwin,aarch64-apple-darwin
          - label: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
          # aarch64 用原生 arm64 runner：Debian/Ubuntu 没有 libwebkit2gtk-4.1-dev 的
          # arm64 交叉包，交叉打包在 x64 runner 上装不出依赖。
          - label: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            rust_targets: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system deps (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            rpm patchelf
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Install Linux system deps (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          # ubuntu-24.04-arm 的原生架构就是 arm64，直接装本包，不需要 dpkg --add-architecture
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            rpm patchelf
        env:
          DEBIAN_FRONTEND: noninteractive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # 先跑一遍前端 typecheck + build：tauri-action 的 beforeBuildCommand 也会跑，
      # 但失败时报错埋在 tauri 日志里，单独一步能直接定位是 TS 还是 Rust 挂了。
      - name: Frontend build
        env:
          BUILD_LOG_DIR: ${{ runner.temp }}/build-logs
        run: |
          mkdir -p "$BUILD_LOG_DIR"
          pnpm --filter frontend build 2>&1 | tee "$BUILD_LOG_DIR/frontend.log"

      # 不用 tauri-action：它唯一的价值是把「打包 + 传 Release」包在一起，而 Release
      # 那半正是它吞报错的地方；打包本身只是一条 `tauri build`。本地 frontend/package.json
      # 已有 @tauri-apps/cli，`pnpm tauri` 就是同一个 CLI，且日志全在 run 输出里。
      # --no-build：前端在上面一步已经建过（还留了日志），别再让 beforeBuildCommand 跑第二遍。
      - name: Build release artifacts
        run: pnpm tauri build --target "${{ matrix.target }}" --no-build --verbose

      # glob 一条都不匹配时 upload-artifact 直接判红，所以先自己确认一遍，
      # 让失败信息是「没打出包」而不是「artifact 上传失败」。
      - name: Locate bundles
        run: |
          echo "bundle files:"
          find src-tauri/target -type f \
            \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' \
               -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.appimage' \
               -o -name '*.sig' \) -print
          count=$(find src-tauri/target -type f \( -name '*.msi' -o -name '*.exe' \
                 -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' \
                 -o -name '*.AppImage' -o -name '*.appimage' \) | wc -l)
          echo "installers: $count"
          test "$count" -ge 1

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.label }}
          path: ${{ env.BUNDLE_GLOBS }}
          if-no-files-found: error
          retention-days: 7

      # GitHub 的 annotation 只留最后一行，真实报错（vue-tsc 诊断、pnpm 的 ERR_*）
      # 全在中段；而 run log 的下载端点要鉴权，本机没 token 下不动。
      # cargo 的输出靠上面那步的 --verbose 直接进 run log，这里补前端日志与产物目录现状。
      - name: Dump logs on failure
        if: failure()
        env:
          BUILD_LOG_DIR: ${{ runner.temp }}/build-logs
        run: |
          for f in "$BUILD_LOG_DIR"/*; do
            [ -f "$f" ] || continue
            echo "==================== $(basename "$f") ===================="
            tail -n 400 "$f"
          done
          echo "==================== bundle dir ===================="
          ls -lR src-tauri/target 2>/dev/null | tail -n 60 || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.label }}
          path: ${{ runner.temp }}/build-logs/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: dist-artifacts
          merge-multiple: true

      - name: Create or refresh release
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist-artifacts -type f \
            \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' \
               -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.appimage' \
               -o -name '*.sig' \) | sort)
          echo "publishing ${#files[@]} file(s) for $TAG:"
          printf '  %s\n' "${files[@]}"
          test "${#files[@]}" -ge 1

          # 重跑同一个 tag 时 Release 已存在：gh release create 会 404/422，
          # 这里改成复用并覆盖同名资产。
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" --draft=false --generate-notes "${files[@]}"
          fi
          gh release view "$TAG"
