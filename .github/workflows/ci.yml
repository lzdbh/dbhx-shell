name: ci

# M0 的硬要求是跨平台 x64 + arm64，所以矩阵必须在 CI 里就把 6 个 target 都过一遍
# cargo check，而不是等 M1 引入 russh/portable-pty 后才发现某个平台编不过。
# `cargo check` 不做链接，但**不等于跨 target 不需要工具链**：tree 里只要有
# build script 会去 pkg-config 找目标平台的 C 库（glib-sys / gtk-sys 就是），
# 交叉就得有 sysroot，否则 check 直接红。aarch64-linux 因此跑在原生 arm64
# runner 上，和 release.yml 的打包矩阵同一个理由、同一块机器。

on:
  push:
    branches: [main]
  pull_request:
  # 只为下面那个临时探针 job 开的：平时不占 runner，手动触发才跑。
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: warn

jobs:
  check:
    name: cargo check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: macos-latest          # Apple Silicon，原生 arm64
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          # 原生 arm64 runner：见文件头那段 —— 交叉 check 会卡在 glib-sys 的
          # pkg-config 上，装 sysroot 远比换块机器贵。
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v5

      # Tauri 在 Linux 上的 build script 会 pkg-config 找 webkit2gtk / gtk，
      # 缺任何一个都会让 cargo check 在任何 crate 编译之前就失败。
      - name: Install Linux system deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            gcc-aarch64-linux-gnu
        env:
          DEBIAN_FRONTEND: noninteractive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # 原来这里有一段「交叉 arm64 就写 aarch64-linux-gnu-gcc 当 linker」的配置：
      # aarch64-linux 改到原生 runner 之后它就是反作用（arm64 机器上没有这个前缀的 ld），
      # 删掉。真要交叉编译再按 sysroot + PKG_CONFIG_SYSROOT_DIR 那套补，别用 check 冒充。

      - name: cargo check
        shell: bash -eo pipefail {0}
        run: |
          mkdir -p .ci-logs
          cargo check --workspace --all-targets --target ${{ matrix.target }} 2>&1 | tee .ci-logs/cargo-check.log

      # annotation 只留 `Process completed with exit code 101` 这一句，交叉 target 的
      # 真实报错（缺 aarch64 的 C 工具链、pkg-config 找不到目标平台的库等）全在中段，
      # 而 run log 的下载端点在这台机器上取不到 —— 日志落进 artifact 才看得回来。
      # glob 不匹配时 upload-artifact 只报 warning，native target 少传一份空包无妨。
      - name: Upload cargo check log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-check-${{ matrix.target }}
          path: .ci-logs/cargo-check.log

  test:
    name: cargo test + contract drift (${{ matrix.os }})
    # 只有原生 runner 能执行测试；跨 target 的 test 由 M1 起用 qemu 补。
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
        env:
          DEBIAN_FRONTEND: noninteractive

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2

      # dbhx-ipc 的 codegen 测试会重新生成 frontend/src/lib/ipc/bindings.ts。
      # timeout 是给「挂死」留的出口：macOS 上这条曾连着跑了 2.5 小时没结束，
      # 而默认的 360 分钟上限意味着一个死锁的测试要占着一台机器半天，且什么日志
      # 都不留。掐在这里，下面的 artifact 就能告诉我们停在哪个 `Running unittests`
      # 之后（编译慢也会在这里露出来：日志末尾是 Compiling 就说明不是挂）。
      - name: cargo test
        shell: bash -eo pipefail {0}
        timeout-minutes: 40
        run: |
          mkdir -p .ci-logs
          cargo test --workspace 2>&1 | tee .ci-logs/cargo-test.log

      # 同 check：annotation 只留退出码，哪个用例在哪个平台炸的要自己捞。
      - name: Upload cargo test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-test-${{ matrix.os }}
          path: .ci-logs/cargo-test.log

      # bindings.ts 是提交进仓库的生成物：Rust 契约改了但忘了重生成，这里就红。
      - name: Fail on generated-binding drift
        run: git diff --exit-code -- frontend/src/lib/ipc/bindings.ts

  # 临时探针（答案拿到就整个删掉）：macOS 上「开本地会话」会永久卡住，而
  # `LocalSession::spawn` 里的 openpty + fork/exec 是**阻塞调用跑在 async 线程上**，
  # 所以测试里的 `tokio::time::timeout` 根本等不到定时器——运行时自己的线程被占死了。
  # 只能从进程外面掐，并且趁它还卡着的时候把现场抓下来：谁还在、停在哪一帧。
  #
  # 两组对照：dbhx-pty 的用例都显式给了程序（/bin/echo、/bin/sh），dbhx-ipc 的那三个用
  # 的是「让 portable-pty 挑默认 shell」。前者挂 = spawn 这条路本身有问题（产品的 bug，
  # macOS 用户点开本机终端就是卡死）；前者过、后者挂 = 默认 shell 的取值在 macOS 上不对。
  pty-probe:
    name: macOS 本地 pty 探针（临时）
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2

      - name: Build the test binaries
        shell: bash -uo pipefail {0}
        run: |
          mkdir -p .ci-logs
          cargo build --tests -p dbhx-pty -p dbhx-ipc 2>&1 | tee .ci-logs/probe-build.log

      - name: Run and watch
        shell: bash -uo pipefail {0}
        run: |
          mkdir -p .ci-logs
          LOG=.ci-logs/probe.log
          {
            echo "== sw_vers"; sw_vers
            echo "== SHELL=$SHELL HOME=$HOME USER=$USER"
            echo "== passwd 里的 shell（portable-pty 在 \$SHELL 为空时读这个）"
            dscl . -read "/Users/$USER" UserShell || echo "dscl 读不到"
            echo "== portable-pty 版本"; grep -A2 'name = "portable-pty"' Cargo.lock
          } >> "$LOG" 2>&1

          BIN_PTY=$(ls -t target/debug/deps/dbhx_pty-* 2>/dev/null | grep -v '\.d$' | head -1)
          BIN_IPC=$(ls -t target/debug/deps/dbhx_ipc-* 2>/dev/null | grep -v '\.d$' | head -1)
          echo "BIN_PTY=$BIN_PTY" "BIN_IPC=$BIN_IPC" >> "$LOG"

          # 起一个测试二进制，最多看 75 秒。退出就报退出码；还活着就抓现场再掐掉。
          watch() {
            local name=$1; shift
            echo "==== $name: $*" | tee -a "$LOG"
            "$@" > "/tmp/$name.out" 2>&1 &
            local pid=$! waited=0
            while [ "$waited" -lt 75 ]; do
              if ! kill -0 "$pid" 2>/dev/null; then
                wait "$pid"; local rc=$?
                echo "$name 在 ${waited}s 内退出，rc=$rc" | tee -a "$LOG"
                tail -20 "/tmp/$name.out" | tee -a "$LOG"
                return "$rc"
              fi
              sleep 5; waited=$((waited + 5))
            done
            echo "$name 卡住：抓现场" | tee -a "$LOG"
            ps -axww -o pid,ppid,state,wchan,command \
              | grep -iE "dbhx_|/bin/(ba)?sh|zsh|login|echo" | grep -v grep >> "$LOG" || true
            sample "$pid" 2 -mayDie >> "$LOG" 2>&1 || echo "sample 失败" >> "$LOG"
            tail -20 "/tmp/$name.out" | tee -a "$LOG"
            kill -9 "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            return 124
          }

          rc=0
          watch pty-explicit "$BIN_PTY" --nocapture || rc=1
          watch ipc-default "$BIN_IPC" --exact \
            commands::log::tests::stopping_a_session_that_was_never_logged_reports_not_found \
            --nocapture || rc=1
          echo "rc=$rc" | tee -a "$LOG"
          exit "$rc"

      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-pty-probe
          path: .ci-logs/probe*.log

  frontend:
    name: frontend build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          # 与本地一致（`pnpm --version` = 11.18.0）。pnpm 11 删掉了
          # ignoredBuiltDependencies，改用 allowBuilds，版本错开会让
          # pnpm-workspace.yaml 的构建脚本审批语义两边不一致。
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # pnpm-workspace.yaml 在仓库根，lockfile 也在根，不在 frontend/ 下
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      # package.json 里 build 已经是 `vue-tsc --noEmit && vite build`，
      # 不用 `-b`（复杂 SFC 会误报 no default export）。
      # 用 --filter 走 tauri.conf.json beforeBuildCommand 的同一条命令，别让它先在 CI 里烂掉。
      - name: Typecheck + build
        run: pnpm --filter frontend build
