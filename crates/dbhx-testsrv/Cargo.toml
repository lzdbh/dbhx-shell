[dependencies]
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "macros"] }
tracing.workspace = true
russh.workspace = true
russh-sftp.workspace = true

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time", "io-util"] }
