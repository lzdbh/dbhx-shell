[package]
name = "dbhx-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "唯一允许 use tauri:: 的 crate：dbhx plugin + 命令契约 + TS 绑定生成"

[dependencies]
arboard.workspace = true
dbhx-model.workspace = true
dbhx-pty.workspace = true
dbhx-session.workspace = true
dbhx-sftp.workspace = true
dbhx-ssh.workspace = true
dbhx-vault.workspace = true
# tauri::command / specta 的宏展开里直接引用了 ::serde 与 ::serde_json 路径，
# 即使源码没有显式使用也不能删。
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
# rc.25 的语言实现不在 tauri-specta 里，`Typescript` 要从这个 crate 拿
specta-typescript.workspace = true
tauri.workspace = true
tauri-specta.workspace = true
tokio.workspace = true
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
# 测试里要推进假拨号器的时钟、也要 #[tokio::test] 宏
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
# 真协议路径（拨号、认证、shell 通道、SFTP、传输）只能对着真服务器跑，
# 假拨号器造不出 `SubsystemStream`
dbhx-testsrv.workspace = true

[lints]
workspace = true
